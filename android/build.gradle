group 'com.compdfkit.flutter.compdfkit_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
        mavenLocal()

    }
}

apply plugin: 'com.android.library'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterSdk = localProperties.getProperty('flutter.sdk')
if (flutterSdk == null) {
    flutterSdk = System.getenv('FLUTTER_ROOT')
}
def flutterJar = flutterSdk == null ? null : file("${flutterSdk}/bin/cache/artifacts/engine/android-arm/flutter.jar")

android {
    compileSdk 35
    namespace "com.compdfkit.flutter.compdfkit_flutter"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }

    dependencies {
        if (flutterJar != null && flutterJar.exists()) {
            compileOnly files(flutterJar)
            testImplementation files(flutterJar)
        }
        compileOnly fileTree(include: ['*.jar','*.aar'], dir: 'libs')

        // dependencies compdfkit pdf sdk
        api 'com.compdf:compdfkit-tools:2.6.9'

        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:5.0.0'
        api 'com.github.bumptech.glide:glide:4.15.1'
        annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
        api 'androidx.documentfile:documentfile:1.0.1'
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
// refresh snapshot implementation
configurations.all { resolutionStrategy.cacheChangingModulesFor 0, 'seconds' }
